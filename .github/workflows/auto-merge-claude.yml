name: Claude-Branches automatisch in main mergen
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Secret-Prüfung: Nur die neuen Commits dieses Branches (gegenüber main)
      # werden geprüft. Bei einem Fund bricht der Job ab, es wird nicht nach main
      # gemergt und damit auch nicht auf den Server deployt. Ist das Secret schon
      # im Branch gelandet, gilt es als kompromittiert und muss geändert werden.
      - name: Secret-Scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --verbose --log-opts="origin/main..origin/${GITHUB_REF_NAME}"
          rm -f gitleaks gitleaks.tar.gz
      - name: In main mergen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout main
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
